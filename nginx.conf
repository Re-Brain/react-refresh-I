server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router handles routing client-side, so any path that isn't a
    # real file (e.g. /horses/5) must still fall back to index.html.
    location / {
        try_files $uri /index.html;
    }
}
